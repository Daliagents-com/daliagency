<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Closed production readiness loop for a business AI agent</title>
  <desc id="desc">Six numbered checkpoints form a continuous loop around a pause control: tools, permissions, approval gates, evaluation, observability, and named ownership.</desc>

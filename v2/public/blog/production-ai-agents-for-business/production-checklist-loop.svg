    <style>
      .node{fill:#fff;stroke:#D6DCE8;stroke-width:2;filter:url(#shadow)}
      .num{font:750 25px Inter,Arial,sans-serif;fill:#fff;text-anchor:middle}
      .flow{fill:none;stroke:#246BFD;stroke-width:4;marker-end:url(#arrow)}
      .icon{fill:none;stroke:#111827;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

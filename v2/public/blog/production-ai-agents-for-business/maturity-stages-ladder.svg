<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Three stages of business AI agent maturity</title>
  <desc id="desc">A three-step ladder moves from drafting assistance, to gated execution, to supervised autonomy, with evidence checkpoints between every stage.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#246BFD"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".15"/></filter>
    <style>
      .stage{stroke:#D6DCE8;stroke-width:2;filter:url(#shadow)}
      .num{font:800 44px Inter,Arial,sans-serif;fill:#fff;text-anchor:middle}
      .flow{fill:none;stroke:#246BFD;stroke-width:5;marker-end:url(#arrow)}
      .line{fill:none;stroke:#111827;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1200" height="640" rx="28" fill="#F4F6FA"/>
  <path class="flow" d="M348 424Q414 380 476 354"/>
  <path class="flow" d="M728 320Q796 274 860 248"/>

  <g transform="translate(92 330)">
    <rect class="stage" width="256" height="204" rx="28" fill="#fff"/>
    <circle cx="60" cy="56" r="34" fill="#246BFD"/><text class="num" x="60" y="72">1</text>
    <path class="line" d="M80 127h99M80 155h72M80 183h91"/>
    <path class="line" d="M39 124l12 12 23-28"/>
  </g>

  <g transform="translate(472 226)">
    <rect class="stage" width="256" height="252" rx="28" fill="#fff"/>
    <circle cx="60" cy="56" r="34" fill="#246BFD"/><text class="num" x="60" y="72">2</text>
    <path class="line" d="M52 132v-14a28 28 0 0156 0v14M42 132h76v64H42z"/>
    <path class="line" d="M150 142l18 18 42-49"/>
  </g>

  <g transform="translate(852 118)">
    <rect class="stage" width="256" height="300" rx="28" fill="#111827"/>
    <circle cx="60" cy="56" r="34" fill="#F06449"/><text class="num" x="60" y="72">3</text>
    <path d="M48 147a40 40 0 1176 18" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    <path d="M114 132l12 35 28-23" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M49 230h158M49 262h112" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g transform="translate(354 496)"><circle cx="0" cy="0" r="18" fill="#F06449"/><path d="M-8 0h16" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g>
  <g transform="translate(738 390)"><circle cx="0" cy="0" r="18" fill="#F06449"/><path d="M-8 0h16" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g>
</svg>

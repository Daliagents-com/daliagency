<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Production AI agent execution loop</title>
  <desc id="desc">A six-stage loop from business input through context, planning, permission checks, tool execution, and observable outcomes, with human approval before risky actions.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#246BFD"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/>
    </filter>
    <style>
      .card{fill:#fff;stroke:#D6DCE8;stroke-width:2;filter:url(#shadow)}
      .step{font:700 18px Inter,Arial,sans-serif;fill:#111827}
      .copy{font:400 14px Inter,Arial,sans-serif;fill:#526071}
      .num{font:700 14px Inter,Arial,sans-serif;fill:#fff}
      .flow{fill:none;stroke:#246BFD;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="640" rx="28" fill="#F4F6FA"/>
  <text x="70" y="72" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="750" fill="#111827">The production agent loop</text>
  <text x="70" y="104" font-family="Inter,Arial,sans-serif" font-size="16" fill="#526071">Every action is permissioned, observable, and recoverable.</text>

  <path class="flow" d="M300 220H440"/>
  <path class="flow" d="M650 220H790"/>
  <path class="flow" d="M900 286V386"/>
  <path class="flow" d="M790 470H650"/>
  <path class="flow" d="M440 470H300"/>
  <path class="flow" d="M190 386V286"/>

  <g transform="translate(80 154)">
    <rect class="card" width="220" height="132" rx="20"/>
    <circle cx="32" cy="32" r="17" fill="#246BFD"/><text class="num" x="28" y="37">1</text>
    <text class="step" x="24" y="78">Business input</text>
    <text class="copy" x="24" y="104">Request, event, or queue item</text>
  </g>
  <g transform="translate(440 154)">
    <rect class="card" width="210" height="132" rx="20"/>
    <circle cx="32" cy="32" r="17" fill="#246BFD"/><text class="num" x="28" y="37">2</text>
    <text class="step" x="24" y="78">Grounded context</text>
    <text class="copy" x="24" y="104">Policy and source retrieval</text>
  </g>
  <g transform="translate(790 154)">
    <rect class="card" width="220" height="132" rx="20"/>
    <circle cx="32" cy="32" r="17" fill="#246BFD"/><text class="num" x="28" y="37">3</text>
    <text class="step" x="24" y="78">Plan and validate</text>
    <text class="copy" x="24" y="104">Choose the next safe action</text>
  </g>
  <g transform="translate(790 386)">
    <rect class="card" width="220" height="132" rx="20"/>
    <circle cx="32" cy="32" r="17" fill="#F06449"/><text class="num" x="28" y="37">4</text>
    <text class="step" x="24" y="78">Permission gate</text>
    <text class="copy" x="24" y="104">Human approval when risky</text>
  </g>
  <g transform="translate(440 386)">
    <rect class="card" width="210" height="132" rx="20"/>
    <circle cx="32" cy="32" r="17" fill="#246BFD"/><text class="num" x="28" y="37">5</text>
    <text class="step" x="24" y="78">Tool execution</text>
    <text class="copy" x="24" y="104">Scoped, idempotent write</text>
  </g>
  <g transform="translate(80 386)">
    <rect class="card" width="220" height="132" rx="20"/>
    <circle cx="32" cy="32" r="17" fill="#246BFD"/><text class="num" x="28" y="37">6</text>
    <text class="step" x="24" y="78">Observe and improve</text>
    <text class="copy" x="24" y="104">Trace, evaluate, retry, learn</text>
  </g>

  <rect x="375" y="556" width="450" height="44" rx="22" fill="#111827"/>
  <text x="600" y="584" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="650" fill="#fff">Stop switch and named owner cover the entire loop</text>
</svg>

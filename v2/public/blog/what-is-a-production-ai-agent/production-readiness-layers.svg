<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Production AI agent readiness layers</title>
  <desc id="desc">A layered model showing that a model and prompt require grounded context, controlled tools, safety gates, evaluation, observability, and operational ownership to become a production system.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".14"/></filter>
    <style>
      .label{font:700 21px Inter,Arial,sans-serif;fill:#111827}
      .copy{font:400 15px Inter,Arial,sans-serif;fill:#526071}
    </style>
  </defs>
  <rect width="1200" height="680" rx="28" fill="#F4F6FA"/>
  <text x="80" y="74" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="750" fill="#111827">What turns a model into a production system</text>
  <text x="80" y="108" font-family="Inter,Arial,sans-serif" font-size="16" fill="#526071">Each outer layer controls a failure mode the model cannot solve alone.</text>

  <g filter="url(#shadow)">
    <rect x="120" y="154" width="960" height="438" rx="34" fill="#111827"/>
    <text class="label" x="155" y="202" fill="#fff" style="fill:#fff">Operational ownership</text>
    <text class="copy" x="875" y="202" fill="#D8DEE9" style="fill:#D8DEE9">owner, runbook, stop switch</text>

    <rect x="165" y="224" width="870" height="320" rx="29" fill="#246BFD"/>
    <text class="label" x="200" y="268" fill="#fff" style="fill:#fff">Observability and evaluation</text>
    <text class="copy" x="816" y="268" fill="#EAF1FF" style="fill:#EAF1FF">traces, alerts, regression tests</text>

    <rect x="220" y="294" width="760" height="202" rx="24" fill="#F8D8CF"/>
    <text class="label" x="255" y="338">Safety and action controls</text>
    <text class="copy" x="744" y="338">permissions, gates, retries</text>

    <rect x="300" y="364" width="600" height="84" rx="20" fill="#fff"/>
    <text class="label" x="335" y="414">Grounded model and tool contracts</text>
  </g>

  <text x="600" y="638" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="650" fill="#111827">Production readiness grows from the outside in, not from a bigger prompt.</text>
</svg>

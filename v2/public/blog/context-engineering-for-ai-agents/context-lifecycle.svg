<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Runtime context lifecycle for an AI agent</title>
  <desc id="desc">A central context window receives seven numbered lanes: instructions, retrieval, tool results, conversation history, external memory, compaction under pressure, and evaluation feedback.</desc>

  <!-- Canvas -->
  <rect width="1600" height="900" fill="#FCFCFA"/>
  <rect x="48" y="48" width="1504" height="804" rx="16" fill="#F5F7FB" stroke="#111312" stroke-opacity="0.12"/>

  <!-- Connector paths: lane nodes to context window -->
  <g fill="none" stroke="#1E3A8A" stroke-width="3" stroke-linecap="round" opacity="0.35">
    <path d="M400 220 L700 340"/>
    <path d="M800 220 L800 340"/>
    <path d="M1200 220 L900 340"/>
    <path d="M1320 450 L1000 450"/>
    <path d="M1000 720 L880 560"/>
    <path d="M600 720 L720 560"/>
    <path d="M280 450 L600 450"/>
  </g>
  <!-- Arrow heads into window -->
  <g fill="none" stroke="#1E3A8A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.55">
    <path d="M686 332 l14 12 -18 4"/>
    <path d="M790 328 l10 16 -10 0"/>
    <path d="M914 332 l-14 12 18 4"/>
    <path d="M1012 440 l-16 10 0 -10"/>
    <path d="M888 548 l-8 -16 16 6"/>
    <path d="M712 548 l8 -16 -16 6"/>
    <path d="M588 440 l16 10 0 -10"/>
  </g>

  <!-- Central context window -->
  <g transform="translate(600 320)">
    <rect width="400" height="260" rx="20" fill="#FFFFFF" stroke="#111312" stroke-opacity="0.16" stroke-width="2"/>
    <!-- Window chrome -->
    <rect width="400" height="44" rx="20" fill="#E9EDFF"/>
    <rect y="24" width="400" height="20" fill="#E9EDFF"/>
    <circle cx="28" cy="22" r="7" fill="#1E3A8A" opacity="0.35"/>
    <circle cx="52" cy="22" r="7" fill="#1E3A8A" opacity="0.55"/>
    <circle cx="76" cy="22" r="7" fill="#1E3A8A"/>
    <!-- Token slots inside window (layered context stack) -->
    <rect x="36" y="68" width="328" height="28" rx="8" fill="#E9EDFF" stroke="#1E3A8A" stroke-width="2"/>
    <rect x="36" y="108" width="268" height="28" rx="8" fill="#F5F7FB" stroke="#1E3A8A" stroke-width="2" stroke-opacity="0.45"/>
    <rect x="36" y="148" width="298" height="28" rx="8" fill="#F5F7FB" stroke="#1E3A8A" stroke-width="2" stroke-opacity="0.45"/>
    <rect x="36" y="188" width="196" height="28" rx="8" fill="#FFE8E2" stroke="#B24C35" stroke-width="2" stroke-opacity="0.7"/>
    <!-- Capacity indicator -->
    <rect x="36" y="230" width="328" height="10" rx="5" fill="#F5F7FB" stroke="#111312" stroke-opacity="0.12"/>
    <rect x="36" y="230" width="210" height="10" rx="5" fill="#1E3A8A" opacity="0.7"/>
  </g>

  <!-- Lane 1: Instructions (document / policy lines) -->
  <g transform="translate(320 100)">
    <rect width="160" height="160" rx="20" fill="#FFFFFF" stroke="#111312" stroke-opacity="0.16" stroke-width="2"/>
    <circle cx="36" cy="36" r="22" fill="#E9EDFF"/>
    <text x="36" y="44" text-anchor="middle" fill="#1E3A8A" font-family="IBM Plex Mono, monospace" font-size="22" font-weight="700">1</text>
    <rect x="48" y="58" width="72" height="78" rx="8" fill="#F5F7FB" stroke="#1E3A8A" stroke-width="3"/>
    <path d="M64 80h40M64 100h40M64 120h24" fill="none" stroke="#1E3A8A" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Lane 2: Retrieval (magnifier + snippet) -->
  <g transform="translate(720 100)">
    <rect width="160" height="160" rx="20" fill="#FFFFFF" stroke="#111312" stroke-opacity="0.16" stroke-width="2"/>
    <circle cx="36" cy="36" r="22" fill="#E9EDFF"/>
    <text x="36" y="44" text-anchor="middle" fill="#1E3A8A" font-family="IBM Plex Mono, monospace" font-size="22" font-weight="700">2</text>
    <rect x="40" y="72" width="44" height="52" rx="6" fill="#F5F7FB" stroke="#687170" stroke-width="2.5"/>
    <path d="M50 88h24M50 102h16" fill="none" stroke="#687170" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="26" fill="none" stroke="#1E3A8A" stroke-width="5"/>
    <path d="M118 118l18 18" fill="none" stroke="#1E3A8A" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Lane 3: Tool results (plug / return payload) -->
  <g transform="translate(1120 100)">
    <rect width="160" height="160" rx="20" fill="#FFFFFF" stroke="#111312" stroke-opacity="0.16" stroke-width="2"/>
    <circle cx="36" cy="36" r="22" fill="#E9EDFF"/>
    <text x="36" y="44" text-anchor="middle" fill="#1E3A8A" font-family="IBM Plex Mono, monospace" font-size="22" font-weight="700">3</text>
    <rect x="42" y="70" width="52" height="64" rx="10" fill="#F5F7FB" stroke="#1E3A8A" stroke-width="3"/>
    <circle cx="58" cy="92" r="5" fill="#1E3A8A"/>
    <circle cx="78" cy="92" r="5" fill="#1E3A8A"/>
    <path d="M58 112h20" fill="none" stroke="#1E3A8A" stroke-width="4" stroke-linecap="round"/>
    <path d="M94 102h28M122 102v-14M122 102v14" fill="none" stroke="#1E3A8A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M110 80l12 10-12 10" fill="none" stroke="#1E3A8A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Lane 4: History (stacked chat turns) -->
  <g transform="translate(1240 370)">
    <rect width="160" height="160" rx="20" fill="#FFFFFF" stroke="#111312" stroke-opacity="0.16" stroke-width="2"/>
    <circle cx="36" cy="36" r="22" fill="#E9EDFF"/>
    <text x="36" y="44" text-anchor="middle" fill="#1E3A8A" font-family="IBM Plex Mono, monospace" font-size="22" font-weight="700">4</text>
    <rect x="40" y="64" width="78" height="40" rx="12" fill="#E9EDFF" stroke="#1E3A8A" stroke-width="3"/>
    <path d="M56 80h46M56 92h30" fill="none" stroke="#1E3A8A" stroke-width="4" stroke-linecap="round"/>
    <rect x="58" y="114" width="78" height="40" rx="12" fill="#F5F7FB" stroke="#687170" stroke-width="3"/>
    <path d="M74 130h46M74 142h28" fill="none" stroke="#687170" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Lane 5: External memory (cylinder store outside window) -->
  <g transform="translate(920 660)">
    <rect width="160" height="160" rx="20" fill="#FFFFFF" stroke="#111312" stroke-opacity="0.16" stroke-width="2"/>
    <circle cx="36" cy="36" r="22" fill="#E9EDFF"/>
    <text x="36" y="44" text-anchor="middle" fill="#1E3A8A" font-family="IBM Plex Mono, monospace" font-size="22" font-weight="700">5</text>
    <ellipse cx="80" cy="72" rx="36" ry="12" fill="#E9EDFF" stroke="#1E3A8A" stroke-width="3"/>
    <path d="M44 72v44c0 8 16 14 36 14s36-6 36-14V72" fill="#F5F7FB" stroke="#1E3A8A" stroke-width="3"/>
    <ellipse cx="80" cy="72" rx="36" ry="12" fill="none" stroke="#1E3A8A" stroke-width="3"/>
    <path d="M44 94c0 8 16 14 36 14s36-6 36-14" fill="none" stroke="#1E3A8A" stroke-width="2.5" opacity="0.5"/>
    <path d="M122 120l18 0M134 108l12 12-12 12" fill="none" stroke="#1E3A8A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Lane 6: Compaction (compress stack - coral pressure accent) -->
  <g transform="translate(520 660)">
    <rect width="160" height="160" rx="20" fill="#FFFFFF" stroke="#111312" stroke-opacity="0.16" stroke-width="2"/>
    <circle cx="36" cy="36" r="22" fill="#FFE8E2"/>
    <text x="36" y="44" text-anchor="middle" fill="#B24C35" font-family="IBM Plex Mono, monospace" font-size="22" font-weight="700">6</text>
    <path d="M48 70h64M48 88h64M48 106h64" fill="none" stroke="#687170" stroke-width="6" stroke-linecap="round" opacity="0.45"/>
    <path d="M56 128h48" fill="none" stroke="#B24C35" stroke-width="10" stroke-linecap="round"/>
    <path d="M80 58v-10M80 58l-12 12M80 58l12 12" fill="none" stroke="#B24C35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M80 148v10M80 148l-12-12M80 148l12-12" fill="none" stroke="#B24C35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Lane 7: Evaluation feedback (checklist + loop - green) -->
  <g transform="translate(200 370)">
    <rect width="160" height="160" rx="20" fill="#FFFFFF" stroke="#111312" stroke-opacity="0.16" stroke-width="2"/>
    <circle cx="36" cy="36" r="22" fill="#E6F3EF"/>
    <text x="36" y="44" text-anchor="middle" fill="#2F7D68" font-family="IBM Plex Mono, monospace" font-size="22" font-weight="700">7</text>
    <path d="M48 78h52M48 104h52M48 130h36" fill="none" stroke="#687170" stroke-width="6" stroke-linecap="round"/>
    <circle cx="124" cy="78" r="12" fill="#2F7D68"/>
    <path d="M118 78l4 4 8-10" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="124" cy="104" r="12" fill="#2F7D68"/>
    <path d="M118 104l4 4 8-10" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M112 140c18-2 28-14 28-28" fill="none" stroke="#2F7D68" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M134 106l8 8 8-12" fill="none" stroke="#2F7D68" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Content generation path versus agentic action loop</title>
  <desc id="desc">Left side shows a short linear path from input prompt through a model to a finished document artifact. Right side shows a looping path from a goal through planning, tools, external state change, and a control gate that returns into the loop.</desc>
  <defs>
    <marker id="arr-blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0 0L14 7L0 14Z" fill="#1E3A8A"/>
    </marker>
    <marker id="arr-green" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0 0L14 7L0 14Z" fill="#2F7D68"/>
    </marker>
    <marker id="arr-coral" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0 0L14 7L0 14Z" fill="#B24C35"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1600" height="900" fill="#FCFCFA"/>
  <rect x="48" y="48" width="1504" height="804" rx="20" fill="#F5F7FB" stroke="#111312" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Vertical separator -->
  <line x1="800" y1="88" x2="800" y2="812" stroke="#111312" stroke-opacity="0.12" stroke-width="2"/>

  <!-- ========== LEFT: content path (linear) ========== -->
  <!-- Rail -->
  <path d="M180 320 H620" fill="none" stroke="#1E3A8A" stroke-width="6" stroke-linecap="round" opacity="0.18"/>
  <path d="M180 320 H300" fill="none" stroke="#1E3A8A" stroke-width="5" stroke-linecap="round" marker-end="url(#arr-blue)"/>
  <path d="M400 320 H520" fill="none" stroke="#1E3A8A" stroke-width="5" stroke-linecap="round" marker-end="url(#arr-blue)"/>
  <path d="M620 320 H700" fill="none" stroke="#2F7D68" stroke-width="5" stroke-linecap="round" marker-end="url(#arr-green)"/>

  <!-- Node 1: prompt / input lines -->
  <g transform="translate(120 220)">
    <rect width="160" height="200" rx="18" fill="#FFFFFF" stroke="#111312" stroke-opacity="0.16" stroke-width="2"/>
    <circle cx="40" cy="40" r="24" fill="#E9EDFF"/>
    <text x="40" y="48" text-anchor="middle" fill="#1E3A8A" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="22" font-weight="700">1</text>
    <!-- chat / prompt icon -->
    <path d="M42 88h76a18 18 0 0118 18v36a18 18 0 01-18 18H78l-22 18v-18H42a18 18 0 01-18-18v-36a18 18 0 0118-18z" fill="#E9EDFF" stroke="#1E3A8A" stroke-width="4" stroke-linejoin="round"/>
    <path d="M48 118h52M48 138h36" stroke="#687170" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Node 2: model / generator -->
  <g transform="translate(320 220)">
    <rect width="160" height="200" rx="18" fill="#FFFFFF" stroke="#111312" stroke-opacity="0.16" stroke-width="2"/>
    <circle cx="40" cy="40" r="24" fill="#E9EDFF"/>
    <text x="40" y="48" text-anchor="middle" fill="#1E3A8A" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="22" font-weight="700">2</text>
    <!-- model spark / core -->
    <circle cx="80" cy="128" r="42" fill="#E9EDFF" stroke="#1E3A8A" stroke-width="5"/>
    <path d="M80 98v60M50 128h60M58 106l44 44M58 150l44-44" stroke="#1E3A8A" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Node 3: artifact document + stop -->
  <g transform="translate(520 220)">
    <rect width="160" height="200" rx="18" fill="#FFFFFF" stroke="#111312" stroke-opacity="0.16" stroke-width="2"/>
    <circle cx="40" cy="40" r="24" fill="#E9EDFF"/>
    <text x="40" y="48" text-anchor="middle" fill="#1E3A8A" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="22" font-weight="700">3</text>
    <!-- document -->
    <rect x="48" y="86" width="64" height="82" rx="8" fill="#F5F7FB" stroke="#1E3A8A" stroke-width="4"/>
    <path d="M60 108h40M60 126h40M60 144h24" stroke="#687170" stroke-width="5" stroke-linecap="round"/>
    <!-- green confirmation (artifact complete) -->
    <circle cx="120" cy="160" r="20" fill="#2F7D68"/>
    <path d="M110 160l8 8 16-18" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Terminal bar under left path (no loop) -->
  <g transform="translate(200 500)">
    <rect width="400" height="72" rx="14" fill="#FFFFFF" stroke="#2F7D68" stroke-width="3"/>
    <path d="M48 36h56" stroke="#2F7D68" stroke-width="8" stroke-linecap="round"/>
    <circle cx="152" cy="36" r="18" fill="#2F7D68"/>
    <path d="M144 36l6 6 12-14" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- document mini + stop bar -->
    <rect x="210" y="16" width="36" height="40" rx="5" fill="#F5F7FB" stroke="#1E3A8A" stroke-width="3"/>
    <path d="M218 28h20M218 38h20M218 48h12" stroke="#687170" stroke-width="3" stroke-linecap="round"/>
    <path d="M290 24v24" stroke="#111312" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round"/>
    <path d="M320 36h48" stroke="#111312" stroke-opacity="0.25" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 10"/>
  </g>

  <!-- Left path bottom note: 1 → 3 linear (math symbols only) -->
  <text x="400" y="640" text-anchor="middle" fill="#687170" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="22" font-weight="600">1 → 2 → 3</text>

  <!-- ========== RIGHT: agentic action loop ========== -->
  <!-- Outer loop ring -->
  <circle cx="1160" cy="430" r="250" fill="none" stroke="#1E3A8A" stroke-width="6" opacity="0.12"/>
  <path d="M1160 180 A250 250 0 1 1 1159.9 180" fill="none" stroke="#1E3A8A" stroke-width="5" opacity="0.35" stroke-dasharray="14 12"/>

  <!-- Flow arcs with arrows (clockwise) -->
  <!-- 1 goal → 2 plan -->
  <path d="M1280 250 Q1360 300 1380 390" fill="none" stroke="#1E3A8A" stroke-width="5" stroke-linecap="round" marker-end="url(#arr-blue)"/>
  <!-- 2 plan → 3 tools -->
  <path d="M1380 470 Q1360 560 1280 610" fill="none" stroke="#1E3A8A" stroke-width="5" stroke-linecap="round" marker-end="url(#arr-blue)"/>
  <!-- 3 tools → 4 external state -->
  <path d="M1040 610 Q960 560 940 470" fill="none" stroke="#1E3A8A" stroke-width="5" stroke-linecap="round" marker-end="url(#arr-blue)"/>
  <!-- 4 state → gate (coral: risk / control) -->
  <path d="M940 390 Q960 300 1040 250" fill="none" stroke="#B24C35" stroke-width="5" stroke-linecap="round" marker-end="url(#arr-coral)"/>
  <!-- gate → 1 goal (loop close, green when approved) -->
  <path d="M1120 200 Q1160 170 1200 200" fill="none" stroke="#2F7D68" stroke-width="5" stroke-linecap="round" marker-end="url(#arr-green)"/>

  <!-- Node 1: Goal (flag / target) -->
  <g transform="translate(1100 150)">
    <circle cx="60" cy="60" r="60" fill="#FFFFFF" stroke="#111312" stroke-opacity="0.16" stroke-width="2"/>
    <circle cx="60" cy="18" r="18" fill="#1E3A8A"/>
    <text x="60" y="25" text-anchor="middle" fill="#FFFFFF" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" font-weight="700">1</text>
    <!-- target -->
    <circle cx="60" cy="68" r="22" fill="none" stroke="#1E3A8A" stroke-width="4"/>
    <circle cx="60" cy="68" r="10" fill="none" stroke="#1E3A8A" stroke-width="4"/>
    <circle cx="60" cy="68" r="3" fill="#1E3A8A"/>
  </g>

  <!-- Node 2: Plan (list / steps) -->
  <g transform="translate(1320 360)">
    <circle cx="60" cy="60" r="60" fill="#FFFFFF" stroke="#111312" stroke-opacity="0.16" stroke-width="2"/>
    <circle cx="60" cy="18" r="18" fill="#1E3A8A"/>
    <text x="60" y="25" text-anchor="middle" fill="#FFFFFF" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" font-weight="700">2</text>
    <path d="M38 48h44M38 68h44M38 88h28" stroke="#687170" stroke-width="6" stroke-linecap="round"/>
    <circle cx="28" cy="48" r="5" fill="#1E3A8A"/>
    <circle cx="28" cy="68" r="5" fill="#1E3A8A"/>
    <circle cx="28" cy="88" r="5" fill="#1E3A8A"/>
  </g>

  <!-- Node 3: Tools (wrench / plug) -->
  <g transform="translate(1100 570)">
    <circle cx="60" cy="60" r="60" fill="#FFFFFF" stroke="#111312" stroke-opacity="0.16" stroke-width="2"/>
    <circle cx="60" cy="18" r="18" fill="#1E3A8A"/>
    <text x="60" y="25" text-anchor="middle" fill="#FFFFFF" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" font-weight="700">3</text>
    <!-- tool: plug + bolt -->
    <rect x="34" y="48" width="52" height="36" rx="8" fill="#E9EDFF" stroke="#1E3A8A" stroke-width="4"/>
    <path d="M48 48V40M72 48V40" stroke="#1E3A8A" stroke-width="5" stroke-linecap="round"/>
    <path d="M48 84v12M72 84v12" stroke="#1E3A8A" stroke-width="5" stroke-linecap="round"/>
    <path d="M86 66h16" stroke="#1E3A8A" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Node 4: External state (database / world) -->
  <g transform="translate(880 360)">
    <circle cx="60" cy="60" r="60" fill="#FFFFFF" stroke="#111312" stroke-opacity="0.16" stroke-width="2"/>
    <circle cx="60" cy="18" r="18" fill="#B24C35"/>
    <text x="60" y="25" text-anchor="middle" fill="#FFFFFF" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" font-weight="700">4</text>
    <!-- cylinder db = external state -->
    <ellipse cx="60" cy="48" rx="28" ry="10" fill="#FFE8E2" stroke="#B24C35" stroke-width="4"/>
    <path d="M32 48v36c0 6 12 10 28 10s28-4 28-10V48" fill="#FFE8E2" stroke="#B24C35" stroke-width="4"/>
    <path d="M32 66c0 6 12 10 28 10s28-4 28-10" fill="none" stroke="#B24C35" stroke-width="3"/>
  </g>

  <!-- Control gate (center): pause + check path -->
  <g transform="translate(1060 350)">
    <rect width="200" height="160" rx="24" fill="#111827"/>
    <!-- coral risk gate badge -->
    <circle cx="100" cy="58" r="32" fill="#F06449"/>
    <!-- pause bars = human/control stop -->
    <rect x="86" y="42" width="10" height="32" rx="3" fill="#FFFFFF"/>
    <rect x="104" y="42" width="10" height="32" rx="3" fill="#FFFFFF"/>
    <!-- gate bar -->
    <path d="M48 108h104" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    <!-- dual outcome: blocked vs allowed -->
    <circle cx="60" cy="132" r="12" fill="#B24C35"/>
    <path d="M54 132h12" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="140" cy="132" r="12" fill="#2F7D68"/>
    <path d="M134 132l5 5 10-11" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right path formula: loop (math only) -->
  <text x="1160" y="780" text-anchor="middle" fill="#687170" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="22" font-weight="600">1 → 2 → 3 → 4 ↻</text>
</svg>
